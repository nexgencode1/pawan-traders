<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="100%" height="100%">
  <defs>
    <linearGradient id="ptGradSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="ptGradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="ptGradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="ptGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" flood-color="#000"/>
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(10, 8)" filter="url(#ptGlow)">
    <!-- Shield / Battery Enclosure -->
    <rect x="12" y="14" width="56" height="52" rx="10" fill="url(#ptGradBlue)"/>
    <!-- Battery Terminals -->
    <rect x="22" y="7" width="10" height="7" rx="2" fill="#E2E8F0"/>
    <rect x="48" y="7" width="10" height="7" rx="2" fill="#E2E8F0"/>
    <circle cx="27" cy="11" r="1.5" fill="#DC2626"/>
    <circle cx="53" cy="11" r="1.5" fill="#2563EB"/>
    
    <!-- Solar Sun Radiance inside / behind Bolt -->
    <circle cx="40" cy="40" r="18" fill="url(#ptGradSun)" opacity="0.25"/>
    <path d="M 40 24 L 40 21 M 40 59 L 40 56 M 24 40 L 21 40 M 59 40 L 56 40 M 29 29 L 26 26 M 51 51 L 48 48 M 29 51 L 26 54 M 51 29 L 48 26" 
          stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

    <!-- High Voltage Lightning Bolt / P-T Energy Symbol -->
    <path d="M 42 20 L 28 39 L 38 39 L 34 60 L 52 37 L 41 37 Z" fill="url(#ptGradSun)"/>
    
    <!-- Eco Solar Leaf Accent -->
    <path d="M 52 46 C 58 45 61 50 59 55 C 54 56 50 52 52 46 Z" fill="url(#ptGradGreen)"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(88, 16)">
    <!-- PAWAN -->
    <text x="0" y="32" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="900" letter-spacing="1.5" fill="#0F172A">
      PAWAN <tspan fill="#F59E0B">TRADERS</tspan>
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="2" y="52" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="3" fill="#2563EB">
      BATTERY &#8226; INVERTER &#8226; SOLAR SOLUTIONS
    </text>
    
    <!-- Verified Dealership Trust Badge -->
    <g transform="translate(245, 41)">
      <rect x="0" y="0" width="112" height="15" rx="7.5" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
      <circle cx="8" cy="7.5" r="3" fill="#10B981"/>
      <text x="16" y="10.5" font-family="'Inter', system-ui, sans-serif" font-size="7.5" font-weight="800" fill="#047857" letter-spacing="0.5">
        PRAYAGRAJ &amp; KAUSHAMBI
      </text>
    </g>
  </g>
</svg>

