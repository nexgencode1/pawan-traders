<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <defs>
    <linearGradient id="ptGradSunM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="ptGradBlueM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="ptGradGreenM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="ptGlowM" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.2" flood-color="#000"/>
    </filter>
  </defs>

  <!-- Battery Enclosure -->
  <rect x="12" y="16" width="56" height="54" rx="12" fill="url(#ptGradBlueM)" filter="url(#ptGlowM)"/>
  <!-- Terminals -->
  <rect x="22" y="9" width="10" height="8" rx="2" fill="#E2E8F0"/>
  <rect x="48" y="9" width="10" height="8" rx="2" fill="#E2E8F0"/>
  <circle cx="27" cy="13" r="1.8" fill="#DC2626"/>
  <circle cx="53" cy="13" r="1.8" fill="#2563EB"/>
  
  <!-- Solar Sun Halo -->
  <circle cx="40" cy="43" r="19" fill="url(#ptGradSunM)" opacity="0.2"/>
  <path d="M 40 26 L 40 23 M 40 63 L 40 60 M 23 43 L 20 43 M 63 43 L 60 43 M 28 31 L 25 28 M 52 55 L 49 52 M 28 55 L 25 58 M 52 31 L 49 28" 
        stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

  <!-- Energy Lightning Bolt -->
  <path d="M 42 22 L 27 42 L 39 42 L 34 64 L 54 39 L 41 39 Z" fill="url(#ptGradSunM)"/>
  
  <!-- Eco Solar Leaf -->
  <path d="M 52 49 C 60 48 63 53 61 59 C 55 60 50 55 52 49 Z" fill="url(#ptGradGreenM)"/>
</svg>

