<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="wbBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="wbRedTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="wbGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="wbShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-opacity="0.3" flood-color="#0F172A"/>
    </filter>
  </defs>

  <!-- Clean Background -->
  <rect width="600" height="450" rx="16" fill="#F8FAFC"/>
  <circle cx="300" cy="225" r="180" fill="#FEF3C7" opacity="0.4"/>
  <circle cx="150" cy="140" r="120" fill="#E2E8F0" opacity="0.5"/>

  <!-- Tall Tubular Inverter Battery Main Group -->
  <g transform="translate(130, 40)" filter="url(#wbShadow)">
    <!-- Tall Heavy Duty Polypropylene Container -->
    <rect x="20" y="90" width="300" height="260" rx="8" fill="url(#wbBody)"/>
    
    <!-- Ribbed Container Reinforcement Patterns -->
    <g fill="#334155" opacity="0.6">
      <rect x="35" y="110" width="6" height="220" rx="2"/>
      <rect x="55" y="110" width="6" height="220" rx="2"/>
      <rect x="280" y="110" width="6" height="220" rx="2"/>
      <rect x="300" y="110" width="6" height="220" rx="2"/>
      <!-- Bottom Base Plate -->
      <rect x="15" y="340" width="310" height="15" rx="3" fill="#020617"/>
    </g>

    <!-- Top Heavy Cover (Red/Crimson for high visibility) -->
    <rect x="15" y="60" width="310" height="35" rx="6" fill="url(#wbRedTop)"/>

    <!-- Sturdy Rope Handles (Side Loops) -->
    <path d="M 18 120 C -5 120, -5 180, 18 180" fill="none" stroke="#F59E0B" stroke-width="8" stroke-linecap="round"/>
    <path d="M 322 120 C 345 120, 345 180, 322 180" fill="none" stroke="#F59E0B" stroke-width="8" stroke-linecap="round"/>

    <!-- 6 Float Water Level Indicators (Tall Ceramic / Transparent Float Vents) -->
    <!-- Indicator 1 -->
    <g transform="translate(50, 20)">
      <rect x="0" y="10" width="12" height="32" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
      <rect x="2" y="12" width="8" height="12" fill="#EF4444"/> <!-- Red danger zone -->
      <rect x="2" y="24" width="8" height="16" fill="#10B981"/> <!-- Green safe zone -->
      <circle cx="6" cy="10" r="4" fill="#DC2626"/> <!-- Float ball -->
    </g>
    <!-- Indicator 2 -->
    <g transform="translate(90, 20)">
      <rect x="0" y="10" width="12" height="32" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
      <rect x="2" y="24" width="8" height="16" fill="#10B981"/>
      <circle cx="6" cy="10" r="4" fill="#DC2626"/>
    </g>
    <!-- Indicator 3 -->
    <g transform="translate(130, 20)">
      <rect x="0" y="10" width="12" height="32" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
      <rect x="2" y="24" width="8" height="16" fill="#10B981"/>
      <circle cx="6" cy="10" r="4" fill="#DC2626"/>
    </g>
    <!-- Indicator 4 -->
    <g transform="translate(195, 20)">
      <rect x="0" y="10" width="12" height="32" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
      <rect x="2" y="24" width="8" height="16" fill="#10B981"/>
      <circle cx="6" cy="10" r="4" fill="#DC2626"/>
    </g>
    <!-- Indicator 5 -->
    <g transform="translate(235, 20)">
      <rect x="0" y="10" width="12" height="32" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
      <rect x="2" y="24" width="8" height="16" fill="#10B981"/>
      <circle cx="6" cy="10" r="4" fill="#DC2626"/>
    </g>
    <!-- Indicator 6 -->
    <g transform="translate(275, 20)">
      <rect x="0" y="10" width="12" height="32" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
      <rect x="2" y="24" width="8" height="16" fill="#10B981"/>
      <circle cx="6" cy="10" r="4" fill="#DC2626"/>
    </g>

    <!-- Heavy Lead Bolt Terminals -->
    <rect x="25" y="45" width="20" height="18" rx="3" fill="#94A3B8"/>
    <circle cx="35" cy="54" r="5" fill="#EF4444"/> <!-- (+) -->

    <rect x="295" y="45" width="20" height="18" rx="3" fill="#94A3B8"/>
    <circle cx="305" cy="54" r="5" fill="#1E293B"/> <!-- (-) -->

    <!-- Front Premium Plate Label -->
    <rect x="60" y="130" width="220" height="165" rx="8" fill="#0B132B" stroke="#1C2541" stroke-width="2"/>
    
    <rect x="60" y="130" width="220" height="34" rx="6" fill="url(#wbGold)"/>
    <text x="170" y="153" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#0F172A" text-anchor="middle">
      TALL TUBULAR INVERTER
    </text>

    <text x="170" y="188" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle">
      12V &bull; 220Ah
    </text>
    <text x="170" y="212" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">
      HEAVY DUTY SPINE TECHNOLOGY
    </text>

    <!-- Specs Badges -->
    <rect x="80" y="230" width="85" height="30" rx="4" fill="#0F172A" stroke="#22C55E" stroke-width="1"/>
    <text x="122" y="250" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="#4ADE80" text-anchor="middle">
      60 MONTHS
    </text>

    <rect x="175" y="230" width="85" height="30" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="217" y="250" font-family="Arial, sans-serif" font-size="10" font-weight="800" fill="#FBBF24" text-anchor="middle">
      SOLAR READY
    </text>
  </g>

  <!-- Category Badge -->
  <g transform="translate(40, 395)">
    <rect width="260" height="34" rx="17" fill="#DC2626"/>
    <text x="130" y="22" font-family="Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">
      WATER BATTERY (TALL TUBULAR)
    </text>
  </g>
</svg>
